    <path d="M0 404 Q 40 376 80 404 T 160 404 T 240 404 T 320 404 T 400 404 T 480 404 T 560 404 V512 H0Z" fill="url(#sea1)"/>
    <path d="M0 404 Q 40 376 80 404 T 160 404 T 240 404 T 320 404 T 400 404 T 480 404 T 560 404" fill="none" stroke="#bfe9ff" stroke-width="8" stroke-linecap="round"/>
    <path d="M-40 448 Q 0 424 40 448 T 120 448 T 200 448 T 280 448 T 360 448 T 440 448 T 520 448 V512 H-40Z" fill="url(#sea2)"/>
